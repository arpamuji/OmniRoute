name: Private Zot Publish

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: "Branch, tag, or commit to build"
        required: true
        default: "main"
        type: string
      image_tag:
        description: "Private image tag"
        required: true
        default: "3.8.0-private"
        type: string

permissions:
  contents: read

env:
  IMAGE_NAME: arpamuji/omniroute

jobs:
  docker:
    name: Build and push to private Zot
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.git_ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to private registry
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runner-base
          push: true
          tags: ${{ secrets.REGISTRY_URL }}/${{ env.IMAGE_NAME }}:${{ inputs.image_tag }}
          provenance: false
          sbom: false
          outputs: type=registry,oci-mediatypes=true
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
